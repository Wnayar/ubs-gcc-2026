services:
  - type: web
    name: ubs-gcc-2026
    runtime: python
    region: singapore
    plan: free # team decision: stay free; curl /health to warm up before triggering each evaluation
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DEBUG_TOKEN
        generateValue: true
