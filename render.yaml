services:
  - type: web
    name: ubs-gcc-2026
    runtime: python
    region: singapore
    plan: free # switch to starter on competition day: no cold starts
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DEBUG_TOKEN
        generateValue: true
